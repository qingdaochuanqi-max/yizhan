<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f2ec">
<meta name="description" content="一站：今天只做一件事。低负担日程、25 分钟专注、压力模式。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一站">
<title>一站 · 今天只做一件事</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --bg:#f5f2ec;
  --card:#fffdf8;
  --ink:#2b2925;
  --ink-soft:#575247;
  --muted:#8c8679;
  --line:#e7e1d5;
  --accent:#2f6d5f;
  --accent-soft:#e2efe9;
  --warn:#ab5c2d;
  --warn-soft:#f8ebdf;
  --radius:16px;
  --shadow:0 1px 2px rgba(70,58,40,.05), 0 10px 26px rgba(70,58,40,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  font-size:16px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  transition:background .35s ease;
  padding-bottom:80px;
}
body.calm{--bg:#ece7df;--card:#f8f4ec;--accent:#4a6a63;--line:#ddd6c9}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.01em}
#app{max-width:780px;margin:0 auto;padding:26px 20px 40px}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px;letter-spacing:.06em}
.brand .date{font-size:13px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;transform:translateY(-2px)}
.top-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}

/* ---------- nav ---------- */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:2px;overflow-x:auto}
body.calm .tabs{display:none}
.tab{padding:8px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0;transition:.15s}
.tab:hover{color:var(--ink-soft);background:rgba(0,0,0,.025)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ---------- card ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{font-size:15px;letter-spacing:.02em}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- buttons ---------- */
.ghost{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--ink-soft);background:transparent;transition:.15s}
.ghost:hover{background:rgba(0,0,0,.03);border-color:#d8d1c3}
.ghost.on{background:var(--accent-soft);border-color:#bcdccf;color:var(--accent)}
.primary{background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font-size:14px;font-weight:500;transition:.15s}
.primary:hover{filter:brightness(1.08)}
.primary:active{transform:translateY(1px)}
.mini{border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12.5px;color:var(--muted);background:transparent;white-space:nowrap}
.mini:hover{color:var(--accent);border-color:#c9d9d2}
.mini.danger:hover{color:var(--warn);border-color:#e5c6b0}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--muted);background:transparent}
.chip:hover{border-color:#cfc7b7;color:var(--ink-soft)}
.chip.on{background:var(--accent-soft);border-color:#bcdccf;color:var(--accent)}

/* ---------- checkin ---------- */
.checkin-grid{display:flex;gap:22px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--ink-soft)}
.field{display:flex;align-items:center;gap:7px}
.field input[type=number]{width:56px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 7px;font-size:13.5px;text-align:center}
.seg{display:inline-flex;gap:3px}
.seg button{width:26px;height:26px;border-radius:7px;font-size:12px;color:var(--muted);border:1px solid var(--line);background:#fff;transition:.12s}
.seg button:hover{border-color:#cfc7b7}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg.hot button.on{background:var(--warn);border-color:var(--warn)}
.advice{margin-top:12px;font-size:13px;color:var(--ink-soft);background:rgba(47,109,95,.06);border-left:2px solid var(--accent);padding:7px 12px;border-radius:0 8px 8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.advice.warn{background:var(--warn-soft);border-left-color:var(--warn);color:#7d4423}
.advice.warn .mini{color:#7d4423;border-color:#dfbfa6;background:#fffaf5}
.advice.warn .mini:hover{border-color:var(--warn);color:var(--warn)}

/* ---------- tasks ---------- */
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:none;padding-bottom:2px}
.task .check{width:21px;height:21px;border-radius:7px;border:1.5px solid #cfc7b7;flex-shrink:0;margin-top:3px;font-size:13px;color:#fff;display:flex;align-items:center;justify-content:center;transition:.15s}
.task .check:hover{border-color:var(--accent)}
.task.done .check{background:var(--accent);border-color:var(--accent)}
.task-main{flex:1;min-width:0}
.task-title{width:100%;border:none;background:transparent;padding:0;font-size:15.5px;line-height:1.5;outline:none;border-radius:4px}
.task-title:focus{background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.task.done .task-title{color:var(--muted);text-decoration:line-through;text-decoration-color:#c3bcae}
.task-next{width:100%;border:none;background:transparent;padding:2px 0 0;font-size:13px;color:var(--muted);outline:none;border-radius:4px}
.task-next::placeholder{color:#b3ada0}
.task-next:focus{background:#fff;box-shadow:0 0 0 3px var(--accent-soft);color:var(--ink-soft)}
.task-side{display:flex;align-items:center;gap:6px;flex-shrink:0;padding-top:1px}
.tomato{font-size:12px;color:var(--muted)}
.quick-add{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.quick-add input{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:14px;outline:none;transition:.15s}
.quick-add input:focus{border-color:#bcdccf;box-shadow:0 0 0 3px var(--accent-soft)}
.notice{font-size:13px;color:#8a5a2b;background:var(--warn-soft);border-radius:10px;padding:9px 12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;padding:10px 0 4px}

/* ---------- timer ---------- */
.timer-card{text-align:center}
.timer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tag{font-size:11.5px;letter-spacing:.1em;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.timer-task{font-size:13.5px;color:var(--muted);margin:6px 0 2px;min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer-digits{font-size:58px;font-weight:250;letter-spacing:.02em;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ink)}
.bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px auto 16px;max-width:340px}
.bar i{display:block;height:100%;background:var(--accent);width:100%;transition:width .3s linear}
.timer-actions{display:flex;gap:8px;justify-content:center}

/* ---------- lists / inbox ---------- */
.inbox-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.inbox-item:last-child{border-bottom:none}
.inbox-item .text{flex:1;min-width:0;word-break:break-word}
.inbox-item .ops{display:flex;gap:6px;flex-shrink:0}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14.5px;background:#fff;outline:none;resize:vertical;min-height:76px;transition:.15s}
textarea:focus{border-color:#bcdccf;box-shadow:0 0 0 3px var(--accent-soft)}
.ifthen{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ifthen:last-child{border-bottom:none}
.ifthen input{border:none;background:transparent;outline:none;padding:4px 6px;border-radius:6px;min-width:60px}
.ifthen input:focus{background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.ifthen .k{color:var(--muted);font-size:12.5px;flex-shrink:0}
.ifthen input.w{flex:1}

/* ---------- routines ---------- */
.routine-item{display:flex;align-items:center;gap:9px;padding:6px 0}
.routine-item .check{width:19px;height:19px;border-radius:6px;border:1.5px solid #cfc7b7;flex-shrink:0;font-size:12px;color:#fff;display:flex;align-items:center;justify-content:center}
.routine-item.on .check{background:var(--accent);border-color:var(--accent)}
.routine-item.on .text{color:var(--muted);text-decoration:line-through;text-decoration-color:#c3bcae}
.routine-item .text{flex:1;font-size:14.5px}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
th.num{text-align:center}
td.num{text-align:center;font-variant-numeric:tabular-nums}
.stat-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.stat{flex:1;min-width:110px;background:rgba(47,109,95,.05);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:500;color:var(--accent);line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(40,35,28,.36);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:18px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(40,30,20,.24);max-height:86vh;overflow:auto}
.modal h3{font-size:16px;margin-bottom:14px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.setting-row:last-of-type{border-bottom:none}
.setting-row input[type=number]{width:64px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;text-align:center;background:#fff}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#2f3b37;color:#f6f3ec;padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.28s;z-index:60;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- calm view ---------- */
.calm-wrap{text-align:center;padding:34px 8px 20px}
.calm-label{font-size:11.5px;letter-spacing:.18em;color:var(--muted);margin-bottom:18px}
.calm-title{font-size:26px;line-height:1.45;font-weight:500;max-width:520px;margin:0 auto 10px}
.calm-next{font-size:14px;color:var(--muted);margin-bottom:26px;min-height:22px}
.calm-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.calm-foot{margin-top:34px;font-size:13px;color:var(--muted);line-height:1.9}
.timer-compact .timer-digits{font-size:44px;margin-top:8px}
@media (max-width:520px){
  #app{padding:18px 14px 40px}
  .timer-digits{font-size:46px}
  .checkin-grid{gap:12px 14px}
  .task-side .mini.label-full{padding:6px 9px;font-size:12.5px}
  .calm-title{font-size:22px}
  input,textarea{font-size:16px}
  .mini{padding:7px 11px;font-size:14px}
  .ghost{padding:9px 13px;font-size:14px}
  .primary{padding:11px 18px;font-size:15px}
  .seg button{width:36px;height:36px;font-size:14px}
  .task .check{width:26px;height:26px;margin-top:1px}
  .routine-item .check{width:24px;height:24px}
  .routine-item{padding:9px 0}
  .tab{padding:11px 12px;font-size:15px}
  .task{padding:13px 0;flex-wrap:wrap}
  .task-main{flex:1 1 60%}
  .task-side{flex:1 1 100%;justify-content:flex-end;margin-top:2px}
  .quick-add input{padding:11px 12px}
  .advice{font-size:14px;padding:9px 12px}
  .calm-actions .ghost{padding:11px 14px}
  .calm-wrap{padding:22px 4px 12px}
  .timer-digits{font-variant-numeric:tabular-nums}
  .modal{max-height:92vh}
}
/* 手机安全区与安装后全屏 */
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(80px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <h1>一站</h1>
      <span class="date" id="dateText"></span>
    </div>
    <div class="top-actions">
      <button class="ghost" id="installBtn" data-act="install" hidden>安装</button>
      <button class="ghost" id="calmBtn" data-act="calm">压力模式</button>
      <button class="ghost" data-act="settings" title="设置">⚙</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';

/* ================= 基础工具 ================= */
var KEY = 'yizhan.v1';
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function pad(n){ return String(n).padStart(2,'0'); }
function dateStr(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(s,n){ var d = parseDate(s); d.setDate(d.getDate()+n); return dateStr(d); }
function fmtCN(s){
  var d = parseDate(s);
  return (d.getMonth()+1)+' 月 '+d.getDate()+' 日 · 周'+'日一二三四五六'.charAt(d.getDay());
}
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
var today = function(){ return dateStr(); };

/* ================= 状态 ================= */
function defaults(){
  return {
    view: 'today',
    calm: false,
    tasks: [],
    inbox: [],
    routines: [
      { id:'r-morning', name:'早间启动', when:'早上', items:[
        { id:uid(), text:'喝水、拉开窗帘' },
        { id:uid(), text:'看一眼今天的必做（只看，不安排）' },
        { id:uid(), text:'挑一件，设 25 分钟' }
      ]},
      { id:'r-evening', name:'晚间收尾', when:'睡前', items:[
        { id:uid(), text:'把没做完的移到明天' },
        { id:uid(), text:'桌面清一清，只留明天的第一件事' },
        { id:uid(), text:'写下明天最小的第一步' }
      ]}
    ],
    ifthen: [
      { id:uid(), cond:'我不想开始', act:'只做 5 分钟，然后允许自己停' }
    ],
    logs: {},
    routineState: {},
    dismissed: {},
    settings: { focus:25, break:5, sound:true }
  };
}
var state;
try {
  var raw = localStorage.getItem(KEY);
  state = raw ? JSON.parse(raw) : defaults();
  var d0 = defaults();
  for (var k in d0) { if (!(k in state)) state[k] = d0[k]; }
  for (var s in d0.settings) { if (!(s in state.settings)) state.settings[s] = d0.settings[s]; }
} catch(e) {
  state = defaults();
}
var storageOK = true;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e) { storageOK = false; }
}
function commit(){ save(); render(); }

/* ================= 计时器 ================= */
var T = { taskId:null, mode:'focus', running:false, endsAt:0, left:null, base:null };
function durFor(mode){ return (mode==='focus' ? state.settings.focus : state.settings.break) * 60000; }
function tLeft(){
  if (T.running) return Math.max(0, T.endsAt - Date.now());
  return T.left == null ? durFor(T.mode) : T.left;
}
function blockMs(){ return T.base || durFor(T.mode); }
function startTimer(){
  if (T.running) return;
  // 先取剩余时长（此时还是暂停态），再切到运行态，顺序不能反
  var left = (T.left == null ? durFor(T.mode) : T.left);
  if (T.base == null) T.base = left;
  T.endsAt = Date.now() + left;
  T.running = true;
  paintTimer();
}
function pauseTimer(){ T.left = tLeft(); T.running = false; paintTimer(); }
function resetTimer(){ T.running = false; T.base = durFor(T.mode); T.left = T.base; paintTimer(); }
function fmtClock(ms){
  var s = Math.ceil(ms/1000);
  return pad(Math.floor(s/60))+':'+pad(s%60);
}
function paintTimer(){
  var digits = $('#timerDigits'); if (!digits) return;
  digits.textContent = fmtClock(tLeft());
  var bar = $('#timerBar');
  if (bar) { bar.style.width = Math.min(100, Math.max(0, tLeft()/blockMs()*100)) + '%'; }
  var tg = $('#timerToggle');
  if (tg) {
    if (T.running) tg.textContent = '暂停';
    else if (state.calm) tg.textContent = '开始 ' + Math.max(1, Math.round(tLeft()/60000)) + ' 分钟';
    else if (tLeft() < blockMs()) tg.textContent = '继续';
    else tg.textContent = '开始';
  }
  var lbl = $('#timerModeLabel');
  if (lbl) { lbl.textContent = T.mode === 'focus' ? '专注段' : '休息'; }
}
function finishBlock(){
  T.running = false;
  if (T.mode === 'focus') {
    var mins = Math.max(1, Math.round(blockMs()/60000));
    var t = null;
    for (var i=0;i<state.tasks.length;i++){ if (state.tasks[i].id === T.taskId) t = state.tasks[i]; }
    if (t) t.focus = (t.focus || 0) + 1;
    var lg = logFor(today());
    lg.focusMin = (lg.focusMin || 0) + mins;
    T.mode = 'break';
    T.base = durFor('break');
    T.left = T.base;
    chime();
    commit();
    toast('完成 ' + mins + ' 分钟。站起来，喝口水，' + state.settings.break + ' 分钟后再决定下一步。');
  } else {
    T.mode = 'focus';
    T.base = durFor('focus');
    T.left = T.base;
    chime();
    commit();
    toast('休息结束。要不要再来一段？也可以就停在这。');
  }
}
var ac = null;
function chime(){
  if (!state.settings.sound) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = ac || new AC();
    var now = ac.currentTime;
    [660, 880].forEach(function(f, i){
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(ac.destination);
      var t0 = now + i*0.16;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.16, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
      o.start(t0); o.stop(t0 + 0.6);
    });
  } catch(e){}
}
setInterval(function(){
  if (!T.running) return;
  if (Date.now() >= T.endsAt) { finishBlock(); return; }
  paintTimer();
}, 250);

/* ================= 数据操作 ================= */
function logFor(d){
  if (!state.logs[d]) state.logs[d] = {};
  return state.logs[d];
}
function todayTasks(){ return state.tasks.filter(function(t){ return t.date === today(); }); }
function liveTasks(){ return todayTasks().filter(function(t){ return !t.done; }); }
function addTask(title, next){
  state.tasks.unshift({ id:uid(), title:title, next:next||'', done:false, date:today(), focus:0, createdAt:Date.now() });
}
function findTask(id){
  for (var i=0;i<state.tasks.length;i++){ if (state.tasks[i].id === id) return state.tasks[i]; }
  return null;
}
function toast(msg){
  var el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ el.classList.remove('show'); }, 5200);
}

/* ================= 渲染 ================= */
var TABS = [
  ['today','今天'], ['inbox','收集箱'], ['routines','固定流程'], ['ifthen','如果…就'], ['log','记录']
];

function render(){
  document.body.classList.toggle('calm', !!state.calm);
  $('#dateText').textContent = fmtCN(today());
  $('#calmBtn').classList.toggle('on', !!state.calm);
  $('#calmBtn').textContent = state.calm ? '退出压力模式' : '压力模式';

  $('#tabs').innerHTML = TABS.map(function(t){
    return '<button class="tab ' + (state.view===t[0]?'on':'') + '" data-act="nav" data-view="' + t[0] + '">' + t[1] + '</button>';
  }).join('');

  var v = $('#view');
  if (state.calm) { v.innerHTML = renderCalm(); paintTimer(); return; }
  if (state.view === 'inbox') v.innerHTML = renderInbox();
  else if (state.view === 'routines') v.innerHTML = renderRoutines();
  else if (state.view === 'ifthen') v.innerHTML = renderIfthen();
  else if (state.view === 'log') v.innerHTML = renderLog();
  else v.innerHTML = renderToday();
  paintTimer();
}

/* ---------- 今天 ---------- */
function adviceText(){
  var l = state.logs[today()] || {};
  var stress = l.stress, energy = l.energy, sleep = l.sleep;
  if (stress >= 4) return { cls:'warn', text:'压力偏高。今天的目标只有一件事，做完就算赢，其余都算加分。' };
  if (sleep != null && sleep < 6) return { cls:'warn', text:'睡得少。别指望高效，把期望调到「完成一点点」，这本身就是正确策略。' };
  if (energy != null && energy <= 2) return { cls:'warn', text:'精力偏低。今天少列几件，先做最不费脑的那件。' };
  if (energy >= 4 && (stress == null || stress <= 2)) return { cls:'', text:'底子不错。可以放三件，也可以留白——留白不算浪费。' };
  if (stress != null && stress >= 3) return { cls:'warn', text:'有点紧。把必做压到 1–2 件，剩下的放进收集箱，它跑不掉。' };
  return { cls:'', text:'不用填得很准。填个大概，是用来决定今天放几件事的。' };
}
function renderCheckin(){
  var l = state.logs[today()] || {};
  var seg = function(kind, val, hot){
    var out = '<span class="seg ' + (hot?'hot':'') + '" data-kind="' + kind + '">';
    for (var i=1;i<=5;i++){
      out += '<button class="' + (val===i?'on':'') + '" data-act="seg" data-kind="' + kind + '" data-val="' + i + '">' + i + '</button>';
    }
    return out + '</span>';
  };
  var a = adviceText();
  var cta = (l.stress >= 4) && !state.calm && liveTasks().length > 1;
  return '<div class="card">' +
    '<div class="card-head"><h2>今天的底子</h2><span class="hint">10 秒，不用精确</span></div>' +
    '<div class="checkin-grid">' +
      '<span class="field">昨晚睡了 <input type="number" min="0" max="14" step="0.5" data-field="sleep" value="' + (l.sleep==null?'':l.sleep) + '"> 小时</span>' +
      '<span class="field">精力 ' + seg('energy', l.energy, false) + '</span>' +
      '<span class="field">压力 ' + seg('stress', l.stress, true) + '</span>' +
    '</div>' +
    '<div class="advice ' + a.cls + '"><span>' + esc(a.text) + '</span>' +
      (cta ? '<button class="mini" data-act="calm" style="flex-shrink:0">只留一件</button>' : '') +
    '</div>' +
  '</div>';
}
function taskCard(t){
  var d = state.tasks;
  return '<div class="task ' + (t.done?'done':'') + '">' +
    '<button class="check" data-act="task-toggle" data-id="' + t.id + '">' + (t.done?'✓':'') + '</button>' +
    '<div class="task-main">' +
      '<input class="task-title" data-field="task-title" data-id="' + t.id + '" value="' + esc(t.title) + '">' +
      '<input class="task-next" data-field="task-next" data-id="' + t.id + '" value="' + esc(t.next) + '" placeholder="下一步：两分钟内能开始的那一下">' +
    '</div>' +
    '<div class="task-side">' +
      (t.focus ? '<span class="tomato">🍅 ' + t.focus + '</span>' : '') +
      '<button class="mini label-full" data-act="task-focus" data-id="' + t.id + '" title="开始专注">25 分</button>' +
      '<button class="mini danger" data-act="task-del" data-id="' + t.id + '" title="删除">✕</button>' +
    '</div>' +
  '</div>';
}
function renderToday(){
  var list = todayTasks();
  var live = list.filter(function(t){ return !t.done; });
  var doneN = list.length - live.length;
  var l = state.logs[today()] || {};
  var html = '';

  // 昨日遗留
  var stale = state.tasks.filter(function(t){ return !t.done && t.date < today(); });
  if (stale.length && state.dismissed[today()] !== 1){
    html += '<div class="notice"><span>有 ' + stale.length + ' 件是之前留下的。要接过来吗？接不过来也没关系。</span>' +
      '<span class="row"><button class="ghost" data-act="rollover">全移到今天</button>' +
      '<button class="mini" data-act="dismiss-rollover">就这样吧</button></span></div>';
  }

  html += renderCheckin();

  html += '<div class="card">' +
    '<div class="card-head"><h2>今天必做</h2>' +
      '<span class="hint">' + (live.length ? '还有 ' + live.length + ' 件 · 能做完 3 件就是好日子' : (list.length ? '都做完了' : '空着也没关系')) + '</span>' +
    '</div>';

  if (live.length > 3){
    html += '<div class="notice"><span>列了 ' + live.length + ' 件，超过 3 件了。压力大的时候，3 件已经算满。</span>' +
      '<button class="ghost" data-act="trim3">其余移进收集箱</button></div>';
  }

  if (!list.length){
    html += '<div class="empty">今天还什么都没写。想到一件就写一件，先写最不费劲的那个。</div>';
  } else {
    live.forEach(function(t){ html += taskCard(t); });
    if (doneN){
      html += '<div class="hint" style="margin-top:12px">已完成 ' + doneN + ' 件' +
        (l.focusMin ? ' · 专注 ' + l.focusMin + ' 分钟' : '') + '</div>';
    }
  }

  html += '<div class="quick-add">' +
      '<input id="quickTask" placeholder="加一件事（按回车）" autocomplete="off">' +
      '<button class="primary" data-act="task-add">加上</button>' +
    '</div></div>';

  html += timerCard();

  // 晚间收尾（复用流程）
  var ev = state.routines.filter(function(r){ return r.id === 'r-evening'; })[0];
  if (ev){
    html += '<div class="card"><div class="card-head"><h2>晚间收尾</h2><span class="hint">3 分钟，不是任务</span></div>' +
      routineBody(ev, true) + '</div>';
  }

  return html;
}
function timerCard(){
  var t = T.taskId ? findTask(T.taskId) : null;
  var chips = [15,25,45].map(function(m){
    return '<button class="chip ' + (state.settings.focus===m?'on':'') + '" data-act="setdur" data-min="' + m + '">' + m + '</button>';
  }).join('');
  return '<div class="card timer-card">' +
    '<div class="timer-head">' +
      '<span class="tag" id="timerModeLabel">' + (T.mode==='focus'?'专注段':'休息') + '</span>' +
      '<span class="row" style="gap:4px">' + chips + '</span>' +
    '</div>' +
    '<div class="timer-task">' + (t ? '当前：' + esc(t.title) : '没选任务也能计时，但选了更容易开始') + '</div>' +
    '<div class="timer-digits" id="timerDigits">' + fmtClock(tLeft()) + '</div>' +
    '<div class="bar"><i id="timerBar"></i></div>' +
    '<div class="timer-actions">' +
      '<button class="primary" id="timerToggle" data-act="timer-toggle">' + (T.running?'暂停':'开始') + '</button>' +
      '<button class="ghost" data-act="timer-reset">归零</button>' +
    '</div>' +
    '<p class="hint" style="margin:12px 0 0">只做这一件。想到别的事，先扔进收集箱。</p>' +
  '</div>';
}

/* ---------- 压力模式 ---------- */
function renderCalm(){
  var live = liveTasks();
  var cur = live[0] || null;
  var others = live.length > 1 ? live.length - 1 : 0;
  var focused = T.taskId ? findTask(T.taskId) : null;
  if (!focused || focused.done || focused.date !== today()) T.taskId = null;
  if (!T.taskId && cur) T.taskId = cur.id;

  var html = '<div class="card calm-wrap">';
  if (!cur){
    html += '<div class="calm-label">压力模式</div>' +
      '<div class="calm-title">现在没有要做的事。</div>' +
      '<div class="calm-next">空着是允许的。想加一件的话，就写最小的那一件。</div>' +
      '<div class="calm-actions"><button class="ghost" data-act="calm">回到完整视图</button></div>' +
      '<div class="calm-foot">喝水 · 呼吸几下 · 看窗外一会儿</div>';
    return html + '</div>';
  }
  html += '<div class="calm-label">现在只做这一件</div>' +
    '<div class="calm-title">' + esc(cur.title) + '</div>' +
    '<div class="calm-next">' + (cur.next ? esc(cur.next) : '不用做完，先做第一步') + '</div>' +
    '<div class="timer-digits" id="timerDigits" style="font-size:46px">' + fmtClock(tLeft()) + '</div>' +
    '<div class="bar" style="max-width:280px"><i id="timerBar"></i></div>' +
    '<div class="calm-actions">' +
      '<button class="primary" id="timerToggle" data-act="timer-toggle">' + (T.running ? '暂停' : '开始 ' + Math.max(1, Math.round(tLeft()/60000)) + ' 分钟') + '</button>' +
      '<button class="ghost" data-act="min5">只做 5 分钟</button>' +
      '<button class="ghost" data-act="task-toggle" data-id="' + cur.id + '">做完了</button>' +
    '</div>' +
    '<div class="calm-foot">' +
      (others ? '其余 ' + others + ' 件都还在列表里，跑不掉。<br>' : '') +
      '做不完也没关系。这一件做完，今天就不算空。' +
    '</div>';
  return html + '</div>';
}

/* ---------- 收集箱 ---------- */
function renderInbox(){
  var html = '<div class="card"><div class="card-head"><h2>脑内倒空</h2>' +
    '<span class="hint">先扔进来，不分类、不排序</span></div>' +
    '<textarea id="inboxInput" placeholder="想到什么就写什么，一行一件。写完不用管它。"></textarea>' +
    '<div class="row" style="justify-content:flex-end;margin-top:10px">' +
      '<button class="primary" data-act="inbox-add">扔进去</button></div></div>';

  if (!state.inbox.length){
    html += '<div class="card"><div class="empty">收集箱是空的。空着挺好。</div></div>';
  } else {
    html += '<div class="card"><div class="card-head"><h2>待定</h2><span class="hint">' + state.inbox.length + ' 条</span></div>';
    state.inbox.slice().reverse().forEach(function(it){
      html += '<div class="inbox-item"><span class="text">' + esc(it.text) + '</span>' +
        '<span class="ops">' +
          '<button class="mini" data-act="inbox-to-task" data-id="' + it.id + '">放到今天</button>' +
          '<button class="mini danger" data-act="inbox-del" data-id="' + it.id + '">✕</button>' +
        '</span></div>';
    });
    html += '</div>';
  }
  html += '<p class="hint" style="text-align:center">东西写下来就不会一直占着脑子。这里不需要整理。</p>';
  return html;
}

/* ---------- 固定流程 ---------- */
function routineBody(r, compact){
  var rs = state.routineState[today()] || (state.routineState[today()] = {});
  var html = '';
  r.items.forEach(function(it){
    var on = !!rs[it.id];
    html += '<div class="routine-item ' + (on?'on':'') + '">' +
      '<button class="check" data-act="routine-toggle" data-id="' + it.id + '">' + (on?'✓':'') + '</button>' +
      '<span class="text">' + esc(it.text) + '</span>' +
      (compact ? '' : '<button class="mini danger" data-act="routine-del" data-rid="' + r.id + '" data-id="' + it.id + '">✕</button>') +
    '</div>';
  });
  if (!r.items.length) html += '<div class="empty" style="padding:4px 0">还没有步骤。</div>';
  if (!compact){
    html += '<div class="row" style="margin-top:10px">' +
      '<input class="ifthen-input" id="ri-' + r.id + '" placeholder="加一个步骤" style="flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:#fff;outline:none;font-size:14px">' +
      '<button class="ghost" data-act="routine-add-item" data-rid="' + r.id + '">加</button></div>';
  }
  return html;
}
function renderRoutines(){
  var html = '';
  state.routines.forEach(function(r){
    var rs = state.routineState[today()] || {};
    var total = r.items.length;
    var doneN = r.items.filter(function(it){ return rs[it.id]; }).length;
    html += '<div class="card"><div class="card-head"><h2>' + esc(r.name) + '</h2>' +
      '<span class="hint">' + (total ? doneN + ' / ' + total : '') + ' · ' + esc(r.when) + '</span></div>' +
      routineBody(r, false) + '</div>';
  });
  html += '<p class="hint" style="text-align:center">固定流程是给「不知道从哪开始」的时候用的。每天自动重置。</p>';
  return html;
}

/* ---------- 如果…就 ---------- */
function renderIfthen(){
  var presets = [
    ['我不想开始','只做 5 分钟，然后允许自己停'],
    ['我卡住了','把问题写成一句话，先做最笨的版本'],
    ['我被打断','记一行「刚才做到哪」，再回来'],
    ['我拿起手机','把它放到另一个房间，回来再计时'],
    ['今天彻底崩了','只完成一件最小的，然后收工']
  ];
  var html = '<div class="card"><div class="card-head"><h2>如果…就…</h2>' +
    '<span class="hint">提前想好，就不用临时靠意志力</span></div>';
  if (!state.ifthen.length) html += '<div class="empty">还没有。下面挑几条顺手的。</div>';
  state.ifthen.forEach(function(it){
    html += '<div class="ifthen">' +
      '<span class="k">如果</span>' +
      '<input class="w" data-field="ifthen-cond" data-id="' + it.id + '" value="' + esc(it.cond) + '">' +
      '<span class="k">就</span>' +
      '<input class="w" data-field="ifthen-act" data-id="' + it.id + '" value="' + esc(it.act) + '">' +
      '<button class="mini danger" data-act="ifthen-del" data-id="' + it.id + '">✕</button>' +
    '</div>';
  });
  html += '<div class="row" style="margin-top:12px"><button class="ghost" data-act="ifthen-add">+ 自己写一条</button></div></div>';

  html += '<div class="card"><div class="card-head"><h2>常用几条</h2><span class="hint">点一下加进去</span></div><div class="row" style="flex-wrap:wrap;gap:8px">';
  presets.forEach(function(p,i){
    html += '<button class="chip" data-act="ifthen-preset" data-i="' + i + '">如果' + p[0] + ' → ' + p[1] + '</button>';
  });
  return html + '</div></div>';
}

/* ---------- 记录 ---------- */
function renderLog(){
  var days = [];
  for (var i=0;i<14;i++) days.push(addDays(today(), -i));
  var rows = days.map(function(d){
    var l = state.logs[d] || {};
    return { d:d, sleep:l.sleep, energy:l.energy, stress:l.stress, focus:l.focusMin||0, done:l.done||0 };
  }).filter(function(r){ return r.sleep!=null || r.energy!=null || r.stress!=null || r.focus || r.done; });

  var withStress = rows.filter(function(r){ return r.stress!=null; });
  var avgStress = withStress.length ? (withStress.reduce(function(a,b){ return a+b.stress; },0)/withStress.length) : null;
  var totalFocus = rows.reduce(function(a,b){ return a+b.focus; },0);
  var totalDone = rows.reduce(function(a,b){ return a+b.done; },0);

  var html = '<div class="card"><div class="card-head"><h2>最近 14 天</h2>' +
    '<span class="hint">' + (rows.length? rows.length + ' 天有记录' : '还没有记录') + '</span></div>';
  html += '<div class="stat-grid">' +
    '<div class="stat"><b>' + (avgStress==null?'—':avgStress.toFixed(1)) + '</b><span>平均压力</span></div>' +
    '<div class="stat"><b>' + totalFocus + '</b><span>专注分钟</span></div>' +
    '<div class="stat"><b>' + totalDone + '</b><span>完成件数</span></div>' +
  '</div>';

  if (rows.length){
    html += '<div style="overflow-x:auto;margin-top:6px"><table><thead><tr>' +
      '<th>日期</th><th class="num">睡眠</th><th class="num">精力</th><th class="num">压力</th><th class="num">专注</th><th class="num">完成</th></tr></thead><tbody>';
    rows.forEach(function(r){
      html += '<tr><td>' + r.d.slice(5) + '</td>' +
        '<td class="num">' + (r.sleep==null?'—':r.sleep) + '</td>' +
        '<td class="num">' + (r.energy==null?'—':r.energy) + '</td>' +
        '<td class="num">' + (r.stress==null?'—':r.stress) + '</td>' +
        '<td class="num">' + (r.focus? r.focus+'m' : '—') + '</td>' +
        '<td class="num">' + (r.done? r.done : '—') + '</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '<p class="hint" style="margin-top:10px">看的是趋势：压力高的那几天，专注和完成是不是明显掉了。那不是你不行，是负荷的问题。</p>';
  } else {
    html += '<div class="empty">先过几天再来。这里不催你。</div>';
  }
  html += '</div>';

  html += '<div class="card"><div class="card-head"><h2>数据</h2><span class="hint">存在这台电脑的浏览器里</span></div>' +
    '<div class="row" style="flex-wrap:wrap;gap:8px">' +
      '<button class="ghost" data-act="export-csv">导出表格 CSV</button>' +
      '<button class="ghost" data-act="backup">备份 JSON</button>' +
      '<button class="ghost" data-act="import">从备份恢复</button>' +
    '</div>' +
    '<p class="hint" style="margin-top:10px">换电脑、清缓存前先备份一下。' + (storageOK ? '' : ' 注意：这台浏览器不允许保存，数据只在本次打开有效。') + '</p>' +
  '</div>';
  return html;
}

/* ================= 弹窗 / 设置 ================= */
function openSettings(){
  var s = state.settings;
  $('#modalRoot').innerHTML = '<div class="overlay" data-act="modal-close-bg">' +
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<h3>设置</h3>' +
      '<div class="setting-row"><span>专注时长</span><input type="number" min="1" max="120" data-field="set-focus" value="' + s.focus + '"> 分钟</div>' +
      '<div class="setting-row"><span>休息时长</span><input type="number" min="1" max="60" data-field="set-break" value="' + s.break + '"> 分钟</div>' +
      '<div class="setting-row"><span>到点提示音</span>' +
        '<button class="ghost ' + (s.sound?'on':'') + '" data-act="toggle-sound">' + (s.sound?'开':'关') + '</button></div>' +
      '<div class="setting-row"><span>清空所有数据</span><button class="ghost" data-act="wipe">清空</button></div>' +
      '<p class="hint" style="margin-top:12px">快捷键：n 加一件事 · b 打开收集箱 · Esc 关闭弹窗</p>' +
      '<p class="hint" style="margin-top:4px;opacity:.75">版本 v3 · 2026-11-09</p>' +
      '<div class="modal-actions"><button class="primary" data-act="modal-close">好</button></div>' +
    '</div></div>';
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }

/* ================= 事件 ================= */
function handleAct(act, d, el){
  var i, t;
  switch(act){
    case 'nav': state.view = d.view; state.calm = false; commit(); break;
    case 'calm': state.calm = !state.calm; state.view = 'today'; commit(); break;
    case 'settings': openSettings(); break;
    case 'install':
      if (deferredPrompt && deferredPrompt.prompt){
        deferredPrompt.prompt();
        deferredPrompt = null;
        var ib = $('#installBtn'); if (ib) ib.hidden = true;
      } else {
        toast('手机浏览器里：点右上角「⋮」→ 添加到主屏幕（或「安装应用」）。');
      }
      break;
    case 'modal-close': closeModal(); break;
    case 'modal-close-bg': if (el.classList.contains('overlay')) closeModal(); break;
    case 'toggle-sound': state.settings.sound = !state.settings.sound; save(); openSettings(); break;
    case 'seg':
      var lg = logFor(today());
      lg[d.kind] = Number(d.val);
      save(); render(); break;
    case 'task-add':
      var inp = $('#quickTask');
      if (!inp) break;
      var v = inp.value.trim();
      if (!v) { inp.focus(); break; }
      addTask(v); inp.value = ''; commit();
      var n2 = $('#quickTask'); if (n2) n2.focus();
      break;
    case 'task-toggle':
      t = findTask(d.id); if (!t) break;
      t.done = !t.done;
      if (t.done){ var lgd = logFor(t.date); lgd.done = (lgd.done||0) + 1; }
      else { var lgu = logFor(t.date); lgu.done = Math.max(0, (lgu.done||0) - 1); }
      commit(); break;
    case 'task-del': state.tasks = state.tasks.filter(function(x){ return x.id !== d.id; }); commit(); break;
    case 'task-focus':
      T.taskId = d.id; T.mode = 'focus'; T.base = durFor('focus'); T.left = T.base;
      T.running = true; T.endsAt = Date.now() + T.left;
      render();
      toast('开始 ' + state.settings.focus + ' 分钟。只做这一件。');
      break;
    case 'min5':
      if (!T.taskId) { var lv = liveTasks(); if (lv.length) T.taskId = lv[0].id; }
      T.mode = 'focus'; T.base = 5*60000; T.left = T.base; T.running = true; T.endsAt = Date.now() + T.left;
      render(); toast('就 5 分钟。做完可以停。'); break;
    case 'timer-toggle':
      if (T.running) pauseTimer();
      else {
        if (!T.taskId){ var lv2 = liveTasks(); if (lv2.length) T.taskId = lv2[0].id; }
        if (T.mode === 'focus' && T.left == null) T.left = durFor('focus');
        startTimer();
      }
      break;
    case 'timer-reset': resetTimer(); break;
    case 'setdur':
      state.settings.focus = Number(d.min);
      if (!T.running && T.mode === 'focus') { T.base = durFor('focus'); T.left = T.base; }
      commit(); break;
    case 'trim3':
      var over = liveTasks().slice(3);
      over.forEach(function(x){
        state.inbox.push({ id:uid(), text:x.title });
        state.tasks = state.tasks.filter(function(y){ return y.id !== x.id; });
      });
      commit(); toast('超出的 ' + over.length + ' 件放进收集箱了，没有丢。'); break;
    case 'rollover':
      state.tasks.forEach(function(x){ if (!x.done && x.date < today()) x.date = today(); });
      commit(); break;
    case 'dismiss-rollover': state.dismissed[today()] = 1; commit(); break;
    case 'inbox-add':
      var ta = $('#inboxInput'); if (!ta) break;
      var lines = ta.value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
      if (!lines.length) break;
      lines.forEach(function(s){ state.inbox.push({ id:uid(), text:s }); });
      ta.value = ''; commit(); ta = $('#inboxInput'); if (ta) ta.focus();
      toast(lines.length > 1 ? '扔进去 ' + lines.length + ' 条。' : '扔进去了。'); break;
    case 'inbox-to-task':
      var it = state.inbox.filter(function(x){ return x.id === d.id; })[0];
      if (it){ addTask(it.text); state.inbox = state.inbox.filter(function(x){ return x.id !== d.id; }); }
      commit(); break;
    case 'inbox-del': state.inbox = state.inbox.filter(function(x){ return x.id !== d.id; }); commit(); break;
    case 'routine-toggle':
      var rs = state.routineState[today()] || (state.routineState[today()] = {});
      rs[d.id] = !rs[d.id]; commit(); break;
    case 'routine-add-item':
      var ri = $('#ri-' + d.rid);
      if (!ri || !ri.value.trim()) break;
      state.routines.forEach(function(r){
        if (r.id === d.rid) r.items.push({ id:uid(), text:ri.value.trim() });
      });
      commit(); break;
    case 'routine-del':
      state.routines.forEach(function(r){
        if (r.id === d.rid) r.items = r.items.filter(function(x){ return x.id !== d.id; });
      });
      commit(); break;
    case 'ifthen-add': state.ifthen.push({ id:uid(), cond:'', act:'' }); commit(); break;
    case 'ifthen-del': state.ifthen = state.ifthen.filter(function(x){ return x.id !== d.id; }); commit(); break;
    case 'ifthen-preset':
      var P = [
        ['我不想开始','只做 5 分钟，然后允许自己停'],
        ['我卡住了','把问题写成一句话，先做最笨的版本'],
        ['我被打断','记一行「刚才做到哪」，再回来'],
        ['我拿起手机','把它放到另一个房间，回来再计时'],
        ['今天彻底崩了','只完成一件最小的，然后收工']
      ][Number(d.i)];
      if (P) { state.ifthen.push({ id:uid(), cond:P[0], act:P[1] }); commit(); }
      break;
    case 'export-csv': exportCSV(); break;
    case 'backup': backup(); break;
    case 'import': importJSON(); break;
    case 'wipe':
      if (confirm('清空所有任务、收集箱和记录？这个不能撤销，建议先备份。')){
        localStorage.removeItem(KEY);
        state = defaults(); save(); closeModal(); render();
        toast('已清空。');
      }
      break;
  }
}

function handleField(field, el){
  var v = el.value;
  if (field === 'task-title'){ var t = findTask(el.dataset.id); if (t) t.title = v.trim() || t.title; save(); }
  else if (field === 'task-next'){ var t2 = findTask(el.dataset.id); if (t2) t2.next = v; save(); }
  else if (field === 'sleep'){
    var v2 = v === '' ? null : Number(v);
    var lg = logFor(today());
    if (v2 === null) delete lg.sleep; else lg.sleep = v2;
    save(); render();
  }
  else if (field === 'ifthen-cond'){ state.ifthen.forEach(function(x){ if (x.id === el.dataset.id) x.cond = v; }); save(); }
  else if (field === 'ifthen-act'){ state.ifthen.forEach(function(x){ if (x.id === el.dataset.id) x.act = v; }); save(); }
  else if (field === 'set-focus'){ state.settings.focus = Math.max(1, Number(v)||25); save(); if (!T.running && T.mode==='focus') { T.base = durFor('focus'); T.left = T.base; } paintTimer(); }
  else if (field === 'set-break'){ state.settings.break = Math.max(1, Number(v)||5); save(); if (!T.running && T.mode==='break') { T.base = durFor('break'); T.left = T.base; } paintTimer(); }
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  handleAct(el.dataset.act, el.dataset, el);
});
document.addEventListener('change', function(e){
  var el = e.target.closest('[data-field]');
  if (el) handleField(el.dataset.field, el);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ closeModal(); return; }
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') {
    if (e.key === 'Enter' && e.target.id === 'quickTask'){ e.preventDefault(); handleAct('task-add',{},e.target); }
    return;
  }
  if (e.key === 'n'){ state.view = 'today'; state.calm = false; render(); var q = $('#quickTask'); if (q) q.focus(); }
  else if (e.key === 'b'){ state.view = 'inbox'; state.calm = false; render(); var ib = $('#inboxInput'); if (ib) ib.focus(); }
});

/* ================= 导入导出 ================= */
function download(name, text, mime){
  var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1000);
}
function exportCSV(){
  var head = ['日期','睡眠','精力','压力','专注分钟','完成件数'];
  var keys = Object.keys(state.logs).sort();
  var lines = [head.join(',')];
  keys.forEach(function(k){
    var l = state.logs[k] || {};
    lines.push([k, l.sleep==null?'':l.sleep, l.energy==null?'':l.energy, l.stress==null?'':l.stress, l.focusMin||0, l.done||0].join(','));
  });
  download('一站记录-' + today() + '.csv', '\ufeff' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function backup(){
  download('一站备份-' + today() + '.json', JSON.stringify(state, null, 2), 'application/json');
}
function importJSON(){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var obj = JSON.parse(String(rd.result));
        if (!obj || !Array.isArray(obj.tasks)) throw new Error('格式不对');
        if (!confirm('用这份备份覆盖当前数据？')) return;
        state = obj;
        var d0 = defaults();
        for (var k in d0) { if (!(k in state)) state[k] = d0[k]; }
        for (var s in d0.settings) { if (!(s in state.settings)) state.settings[s] = d0.settings[s]; }
        save(); closeModal(); render();
        toast('已恢复。');
      } catch(err){ alert('这个文件读不出来，确认是「一站」导出的 JSON 备份。'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ================= 安装 / 离线 ================= */
var deferredPrompt = null;
function setupPWA(){
  if (typeof navigator === 'undefined') return;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    var b = $('#installBtn');
    if (b) b.hidden = false;
  });
  window.addEventListener('appinstalled', function(){
    deferredPrompt = null;
    var b = $('#installBtn');
    if (b) b.hidden = true;
    toast('装好了。手机桌面上会有「一站」的图标。');
  });
  if (!('serviceWorker' in navigator)) return;
  var secure = false;
  try { secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'; } catch(e){}
  if (!secure) return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
setupPWA();

/* ================= 启动 ================= */
render();
})();
</script>
